[package]
name = "scap"
description = "Modern, high-performance screen capture library for Rust. Cross-platform."
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = [
	"Siddharth <siddharth99c@gmail.com>",
	"Pranav <pranav2000joglekar@gmail.com>",
]
readme = "README.md"
repository = "https://github.com/WolfSofware/scap"
keywords = ["screen", "recording", "video", "capture", "media"]
categories = ["graphics", "multimedia", "multimedia::video"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Graphics_Direct3D11",
	"Win32_Graphics_Dxgi_Common",
	"Win32_Graphics_Gdi",
	"Win32_UI_HiDpi",
	"Win32_UI_WindowsAndMessaging",
] }
wasapi = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.39.6"
core-graphics-helmer-fork = "0.24.0"
screencapturekit = "=11.1.1"
cocoa = "0.25.0"
objc = "0.2.7"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_44"] }
dbus = "0.9.12"
rand = "0.10.3"
libc = "0.2"
x11rb = { version = "0.14", features = ["randr", "shm"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
